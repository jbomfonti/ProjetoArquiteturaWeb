
services:
  postgres-hotel:
    image: 'bitnami/postgresql:latest'
    environment:
      POSTGRESQL_USERNAME: hotel
      POSTGRESQL_PASSWORD: hotel123
      POSTGRESQL_DATABASE: hoteldb
    ports:
      - "5432:5432"
    volumes:
      - postgres-hotel-data:/bitnami/postgresql
    networks:
      - microservices-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - microservices-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CREATE_TOPICS: "reserva.criada:3:1,reserva.criada.DLT:1:1,pagamento.resultado:3:1,pagamento.resultado.DLT:1:1"
    networks:
      - microservices-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - microservices-net

  postgres-pagamentos:
    image: 'bitnami/postgresql:latest'
    environment:
      POSTGRESQL_USERNAME: pagamentos
      POSTGRESQL_PASSWORD: pagamentos123
      POSTGRESQL_DATABASE: pagamentosdb
    ports:
      - "5433:5432"
    volumes:
      - postgres-pagamentos-data:/bitnami/postgresql
    networks:
      - microservices-net

volumes:
  postgres-hotel-data:
  postgres-pagamentos-data:

networks:
  microservices-net:
    driver: bridge